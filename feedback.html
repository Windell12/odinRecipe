
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
</head>

<body>

    <h2><a href="./index.html">← Back to Home</a></h2>

    <h1>We Value Your Feedback!</h1>

    <p>
        Thank you for visiting our recipe website!
        We would love to know what you think.
        Your suggestions help us improve and share better recipes.
    </p>

    <hr>

    <form>
        <label for="name">Your Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br><br>

        <label for="email">Your Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label for="rating">How would you rate our website?</label><br>
        <select id="rating" name="rating">
            <option value="">Choose a rating</option>
            <option value="excellent">Excellent</option>
            <option value="good">Good</option>
            <option value="average">Average</option>
            <option value="poor">Needs Improvement</option>
        </select>
        <br><br>

        <label for="feedback">Your Feedback or Suggestions:</label><br>
        <textarea id="feedback" name="feedback" rows="5" cols="40"
        placeholder="Write your thoughts here..." required></textarea>
        <br><br>

        <input type="submit" value="Send Feedback">
        <input type="reset" value="Clear">
    </form>

    <hr>

    <h3>Thank You for Sharing! ♡</h3>
    <p>Your feedback means a lot to us. Happy cooking!</p>

    <img src="Capybara✨️.jpg" alt="Cute Capybara" width="200">

</body>
</html>
